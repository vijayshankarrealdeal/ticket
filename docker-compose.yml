# WorkspaceX local stack.
# Maps to BACKEND_SPEC.md §13 (Deployment / infra sketch):
#   - Postgres 16 + pgvector      -> db
#   - Redis 7 (cache + pubsub)    -> redis
#   - S3-style object storage     -> minio
#   - API + workers (same binary) -> api, worker
#   - Langflow (self-hosted AI)   -> langflow
#   - React SPA via nginx         -> web

name: workspacex

services:
  db:
    # pgvector/pgvector:pg16 = Postgres 16 with the pgvector extension
    # preinstalled (needed for tickets.subject_embedding, kb_chunks.embedding).
    # On first boot the scripts in deploy/db-init run once (the postgres image
    # runs everything in /docker-entrypoint-initdb.d when the data dir is
    # empty). That creates the second `langflow` database so the Langflow
    # container isn't crash-looping on "database does not exist".
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: workspacex
      POSTGRES_PASSWORD: workspacex
      POSTGRES_DB: workspacex
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspacex -d workspacex"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-init:
    # One-shot companion to the db-init scripts: runs after Postgres is ready
    # and creates the `langflow` database idempotently. Covers the "existing
    # volume, init scripts already skipped" case where deploy/db-init/*.sh
    # never gets a chance to run (postgres only executes them on empty data
    # dirs). Exits 0 the moment it finishes; compose treats `service_completed
    # _successfully` as a satisfied dependency.
    image: pgvector/pgvector:pg16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: workspacex
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        psql -h db -U workspacex -d workspacex -v ON_ERROR_STOP=1 <<-EOSQL
          SELECT 'CREATE DATABASE langflow OWNER workspacex'
           WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'langflow')\gexec
        EOSQL
    restart: "no"

  redis:
    # Redis 7 - oauth:<state> keys, WS fan-out, rate limits, unread counters.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # S3-compatible object storage for POST /uploads presigned URLs (spec §2).
    # Swap for AWS S3 / GCS in prod.
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: workspacex
      MINIO_ROOT_PASSWORD: workspacex-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  langflow:
    # Self-hosted Langflow for the Agent Builder (spec §3.11.A).
    # `db-init` must finish creating the `langflow` database before this
    # container connects; otherwise Langflow crash-loops on "database does
    # not exist".
    #
    # Direct access is discouraged: the superuser password is a strong random
    # value that only the api container sees (via LANGFLOW_SUPERUSER_PASSWORD
    # injected from the host .env). WorkspaceX users SSO in through our own
    # /flow/launch route which provisions a dedicated per-user Langflow
    # account and logs in as that user — so direct login attempts at :7860
    # can't guess the admin password.
    #
    # We build a thin custom image on top of `langflowai/langflow:latest`
    # that bakes in a CSS+JS rebrand overlay: hides the Langflow logo /
    # GitHub / Discord chips / welcome splash, and replaces the "Version"
    # line in the user dropdown with the signed-in user's email + name.
    # See [deploy/langflow](deploy/langflow/) for the Dockerfile + assets.
    build:
      context: ./deploy/langflow
    image: workspacex-langflow:latest
    restart: unless-stopped
    environment:
      LANGFLOW_DATABASE_URL: postgresql://workspacex:workspacex@db:5432/langflow
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-admin}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD:?set LANGFLOW_SUPERUSER_PASSWORD in .env — strong random string shared with the api container}
      LANGFLOW_NEW_USER_IS_ACTIVE: "false"
      LANGFLOW_CONFIG_DIR: /app/langflow
      # Needed so the /flow/launch HTML bridge can POST credentials from the
      # SPA / backend origin and have Langflow reply with Set-Cookie.
      # Without credentials=true the browser won't store the auth cookie.
      LANGFLOW_CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8000
    ports:
      - "7860:7860"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  api:
    # FastAPI + Uvicorn. On boot, app/db.py:
    #   1. waits for Postgres to accept connections (retry loop),
    #   2. applies app/schema.sql (IF NOT EXISTS — idempotent), and
    #   3. seeds the demo workspace when the DB is empty.
    # Then app/s3.py ensures the MinIO bucket exists.
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ROLE: api
      PORT: 8000
      # config.py normalizes both `postgresql://` and `postgresql+asyncpg://`.
      DATABASE_URL: postgresql://workspacex:workspacex@db:5432/workspacex
      REDIS_URL: redis://redis:6379
      # S3_ENDPOINT is the URL the api container uses to talk to MinIO.
      # S3_PUBLIC_URL is what we rewrite into presigned URLs so a browser on
      # the host network (http://localhost:3000) can PUT to the same object.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_BUCKET: workspacex
      S3_ACCESS_KEY: workspacex
      S3_SECRET_KEY: workspacex-secret
      LANGFLOW_URL: http://langflow:7860
      # Host the BROWSER uses to reach Langflow. The api→Langflow path is the
      # internal `langflow` hostname above; the redirect we hand the browser
      # needs the public one (`localhost:7860` in dev, a real origin in prod).
      LANGFLOW_PUBLIC_URL: ${LANGFLOW_PUBLIC_URL:-http://localhost:7860}
      # Superuser creds the api uses to provision per-user Langflow accounts.
      # NOT exposed to the browser — user SSO goes through a generated
      # per-user password stashed encrypted in `users.langflow_password_secret_id`.
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-admin}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD:?set LANGFLOW_SUPERUSER_PASSWORD in .env}
      # Used to encrypt per-user Langflow passwords at rest. Rotate by changing
      # this value + running the re-provision command (admin resets passwords).
      WORKSPACEX_SECRET_KEY: ${WORKSPACEX_SECRET_KEY:-workspacex-dev-key}
      AUTO_MIGRATE: "1"
      AUTO_SEED: "1"
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      # Secrets — override via .env, never commit real values.
      AZURE_OPEN_AI_KEY: ${AZURE_OPEN_AI_KEY:-}
      AZURE_ENDPOINT: ${AZURE_ENDPOINT:-}
      GOOGLE_CLIENT_ID: ${Client_ID:-}
      GOOGLE_CLIENT_SECRET: ${Client_Secret:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    # Same image as api. Build 1: a stub that heartbeats every 60s (see
    # backend/app/worker.py). Wire real jobs (AI responder, SLA engine,
    # outbox dispatcher, health prober) per spec §11 as Build 2/3 ships.
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ROLE: worker
      DATABASE_URL: postgresql://workspacex:workspacex@db:5432/workspacex
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      LANGFLOW_URL: http://langflow:7860
      # Workers share schema apply/seed with the api — safe because both steps
      # are idempotent (IF NOT EXISTS + "zero users?" guard).
      AUTO_MIGRATE: "1"
      AUTO_SEED: "0"
      AZURE_OPEN_AI_KEY: ${AZURE_OPEN_AI_KEY:-}
      AZURE_ENDPOINT: ${AZURE_ENDPOINT:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  db_data:
  redis_data:
  minio_data:
