name: Deploy frontend (React SPA)

# Builds the Vite SPA and deploys to Azure Static Web Apps.
# VITE_API_URL is baked in at build time — point it at the api
# Container App FQDN (or /api if you front both with Azure Front Door).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # so SWA can comment preview URLs on PRs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: ${{ github.event_name == 'pull_request' && 'upload' || 'upload' }}
          app_location: "/"          # Vite project root
          output_location: "dist"    # vite build output
          # No api_location — our API runs on Container Apps, not SWA.
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

  close-pr-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close SWA preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
