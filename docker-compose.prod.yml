# Prod overlay applied on top of docker-compose.yml. Adds Caddy as the
# public-facing reverse proxy / TLS terminator, locks the api/web ports
# inside the docker network, and points the api at the prod domain.
#
# Usage on the VM:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Required env (CI writes /opt/workspacex/.env from GitHub secrets):
#   PUBLIC_DOMAIN              e.g. workspacx.com
#   ACME_EMAIL                 contact email Caddy registers with Let's Encrypt
#   POSTGRES_PASSWORD          rotate from default `workspacex`
#   LANGFLOW_SUPERUSER_PASSWORD
#   WORKSPACEX_SECRET_KEY
#   WORKSPACEX_INTERNAL_KEY
#   PLATFORM_ADMIN_EMAIL
#   PLATFORM_ADMIN_PASSWORD    >=12 chars; bootstraps the super-admin row
#                              on first boot only

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  db-init:
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}

  api:
    # Pass every key in /opt/workspacex/.env through to the container so the
    # backend can read OUTLOOK_*, MICROSOFT_*, SMTP_*, channel tokens, etc.
    # without each one being listed individually in compose. Without this,
    # the api falls into its dev-mode short-circuit (e.g. `code=dev` for
    # OAuth) because os.environ.get("OUTLOOK_CLIENT_ID") returns None.
    env_file: .env
    environment:
      DATABASE_URL: postgresql://workspacex:${POSTGRES_PASSWORD}@db:5432/workspacex
      CORS_ORIGINS: https://${PUBLIC_DOMAIN},https://www.${PUBLIC_DOMAIN}
      SPA_ORIGIN: https://${PUBLIC_DOMAIN}
      BACKEND_ORIGIN: https://${PUBLIC_DOMAIN}
      LANGFLOW_PUBLIC_URL: https://${PUBLIC_DOMAIN}/lf
      AUTO_SEED: "0"
      # Caddy is in front of every request — trust X-Forwarded-For so the
      # auth rate limiter, audit log, and presence tracker see the real
      # client IP instead of the Caddy container's address.
      TRUST_PROXY_HEADERS: "1"
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}

  worker:
    env_file: .env
    environment:
      DATABASE_URL: postgresql://workspacex:${POSTGRES_PASSWORD}@db:5432/workspacex

  web:
    build:
      context: .
      args:
        VITE_API_URL: /api

  langflow:
    environment:
      LANGFLOW_CORS_ORIGINS: https://${PUBLIC_DOMAIN}
      LANGFLOW_DATABASE_URL: postgresql://workspacex:${POSTGRES_PASSWORD}@db:5432/langflow

volumes:
  caddy_data:
  caddy_config:
